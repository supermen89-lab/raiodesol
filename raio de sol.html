<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raio de Sol | Boutique Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #f7d6c8;
            --secondary-color: #fceee9;
            --accent-color: #e2b2a1;
            --bg-color: #faf6f0;
            --text-dark: #5c4d46;
            --text-muted: #9c8a81;
            --card-radius: 24px;
            --btn-radius: 50px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, .menu-title {
            font-family: 'Fredoka', sans-serif;
        }

        /* --- LAYOUT GERAL --- */
        .main-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
            padding-top: var(--safe-top);
        }

        /* BARRA TOPO MOBILE */
        .mobile-header {
            display: none;
            background: rgba(254, 254, 254, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: calc(15px + var(--safe-top)) 20px 15px 20px;
            position: sticky;
            top: 0;
            z-index: 90;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(92, 77, 70, 0.04);
        }

        .hamburger-btn {
            background: #ffffff;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 16px;
            cursor: pointer;
            color: var(--text-dark);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(92, 77, 70, 0.06);
        }

        /* --- TITULO RAIO DE SOL (MAIOR E SEM FUNDO) --- */
        .logo-container {
            text-align: center;
        }

        .text-logo {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 4rem;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing:2px;
            color: #ffffff;
            -webkit-text-stroke: 1.5px #e2b2a1;
            filter: drop-shadow(0px 3px 5px rgba(220, 207, 207, 0.15));
            transition: font-family 0.6s cubic-bezier(0.4,0,0.2,1);
        }

        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar {
            position: fixed;
            top: 0; left: 0; width: 280px; height: 100vh;
            background: #ffffff;
            box-shadow: 4px 0 25px rgba(92, 77, 70, 0.04);
            z-index: 100;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(92, 77, 70, 0.05);
        }

        .sidebar-header {
            margin-bottom: 35px;
            padding-bottom: 10px;
        }

        .menu-title {
            font-size: 1.3rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-sidebar-btn { display: none; }

        .menu-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: auto;
        }

        .menu-btn {
            background: var(--secondary-color);
            border: none;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--btn-radius);
            cursor: pointer;
            color: var(--text-dark);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: capitalize;
            text-align: left;
            width: 100%;
        }

        .menu-btn i { font-size: 1rem; color: var(--text-muted); }

        .menu-btn:hover, .menu-btn:active {
            background: var(--primary-color);
            padding-left: 24px;
        }

        .menu-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(247, 214, 200, 0.5);
        }
        .menu-btn.active i { color: #ffffff; }

        /* --- CONTAINER DO LOGÓTIPO EM CÍRCULO COM BRILHO --- */
        .sidebar-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 30px;
            border-top: 1px solid var(--secondary-color);
            margin-top: 20px;
        }

        .circle-logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(247, 214, 200, 0.8), 0 0 40px rgba(226, 178, 161, 0.4);
            animation: gentleGlow 3s infinite ease-in-out;
        }

        .circle-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }

        @keyframes gentleGlow {
            0% { box-shadow: 0 0 15px rgba(247, 214, 200, 0.6), 0 0 30px rgba(226, 178, 161, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(247, 214, 200, 1), 0 0 50px rgba(226, 178, 161, 0.6), 0 0 15px rgba(255, 255, 255, 0.8); transform: scale(1.02); }
            100% { box-shadow: 0 0 15px rgba(247, 214, 200, 0.6), 0 0 30px rgba(226, 178, 161, 0.3); transform: scale(1); }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(92, 77, 70, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 95;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .content-wrapper {
            flex-grow: 1;
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .desktop-logo-box {
            text-align: center;
            padding: 50px 20px 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
        }

        /* --- GRELHA DE PRODUTOS --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: #ffffff;
            border-radius: var(--card-radius);
            padding: 12px;
            box-shadow: 0 8px 20px rgba(92, 77, 70, 0.03);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (hover: hover) {
            .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(92, 77, 70, 0.07); }
            .product-card::after {
                content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
                background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
                transform: skewX(-25deg); pointer-events: none;
            }
            .product-card:hover::after { left: 150%; transition: all 0.75s ease-in-out; }
        }

        .product-image-container {
            width: 100%; height: 300px; border-radius: calc(var(--card-radius) - 4px); overflow: hidden; position: relative; background-color: var(--secondary-color);
        }
        .product-image-container img { width: 100%; height: 100%; object-fit: cover; }

        .multiple-images-badge {
            position: absolute; top: 10px; left: 10px; background: rgba(254, 254, 254, 0.95); color: var(--text-dark); padding: 5px 12px; font-size: 0.75rem; font-weight: 700; border-radius: var(--btn-radius);
        }

        .product-info { padding: 12px 6px 4px 6px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .product-category { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px; }
        .price-tag { font-weight: 700; font-size: 1.1rem; background: var(--secondary-color); padding: 5px 14px; border-radius: var(--btn-radius); display: inline-block; }
        .details-btn { background: var(--primary-color); color: var(--text-dark); border: none; padding: 11px; font-size: 0.85rem; font-weight: 600; border-radius: var(--btn-radius); margin-top: 12px; width: 100%; }

        /* --- LIGHTBOX --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(92, 77, 70, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .lightbox.active { display: flex; }
        .lightbox-content { position: relative; background: #ffffff; width: 100%; max-width: 400px; border-radius: var(--card-radius); overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .lightbox-img { width: 100%; height: 50vh; max-height: 450px; object-fit: cover; }
        .lightbox-details { padding: 20px; text-align: center; }
        .close-btn { position: absolute; top: 12px; right: 12px; background: #ffffff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 15; }
        .nav-btn { position: absolute; top: 40%; transform: translateY(-50%); background: #ffffff; width: 42px; height: 42px; border-radius: 50%; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* --- PAINÉIS ADMIN --- */
        .admin-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(92, 77, 70, 0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2500; padding: 15px; }
        .admin-modal.active { display: flex; }
        .admin-box { background: white; padding: 25px; width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; border-radius: var(--card-radius); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid var(--secondary-color); background: var(--bg-color); outline: none; font-size: 0.9rem; border-radius: 14px; }
        .btn-submit { background: var(--primary-color); border: none; padding: 12px; width: 100%; font-weight: 700; border-radius: var(--btn-radius); margin-top: 5px; cursor: pointer; }

        /* LISTA DE ELIMINAÇÃO DE ARTIGOS NO ADMIN */
        .admin-item-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid var(--secondary-color);
            border-radius: 14px;
            background: var(--bg-color);
            padding: 5px;
        }
        .admin-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .admin-item-row:last-child { border-bottom: none; }
        .admin-item-info { display: flex; align-items: center; gap: 10px; }
        .admin-item-thumb { width: 35px; height: 35px; border-radius: 6px; object-fit: cover; }
        .admin-item-name { font-size: 0.85rem; font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-delete-item {
            background: #ff7675; color: white; border: none; padding: 5px 12px; font-size: 0.75rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .btn-delete-item:hover { background: #d63031; }

        footer { text-align: center; padding: 30px 20px calc(30px + var(--safe-bottom)) 20px; background: #ffffff; color: var(--text-muted); font-size: 0.85rem; border-radius: var(--card-radius) var(--card-radius) 0 0; margin-top: auto; }
        .admin-trigger { cursor: pointer; margin-left: 6px; }

        /* --- RESPONSIVIDADE MOBILE --- */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed; left: -300px; top: 0; width: 280px; height: 100vh; z-index: 500;
                border-radius: 0 var(--card-radius) var(--card-radius) 0;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar.active { transform: translateX(300px); }
            .close-sidebar-btn { display: flex; background: var(--secondary-color); border: none; width: 36px; height: 36px; border-radius: 50%; align-items: center; justify-content: center; }
            .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
            .mobile-header { display: flex; }
            .desktop-logo-box { display: none; }
            .content-wrapper { margin-left: 0; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .product-image-container { height: 200px; }
            .text-logo { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="mobile-header">
        <button class="hamburger-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="logo-container">
            <span class="text-logo">Raio de sol</span>
        </div>
        <div style="width:46px;"></div>
    </div>

    <div class="main-layout">

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="menu-title"><i class="fa-solid fa-bars-staggered" style="color:var(--accent-color);"></i> Menu</span>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="menu-nav">
                <button class="menu-btn active" onclick="filterProducts('Todos')">
                    <i class="fa-solid fa-border-all"></i> Todos os Artigos
                </button>
                <button class="menu-btn" onclick="filterProducts('Roupa')">
                    <i class="fa-solid fa-shirt"></i> Roupa Feminina
                </button>
                <button class="menu-btn" onclick="filterProducts('Acessórios')">
                    <i class="fa-regular fa-gem"></i> Acessórios
                </button>
                <button class="menu-btn" onclick="filterProducts('Bolsas')">
                    <i class="fa-solid fa-bag-shopping"></i> Bolsas e Malas
                </button>
                <button class="menu-btn" onclick="filterProducts('Outros')">
                    <i class="fa-solid fa-star"></i> Outros Inspirados
                </button>
            </div>

            <div class="sidebar-logo-box">
                <div class="circle-logo-wrapper">
                    <img id="siteLogoCircle" src="https://via.placeholder.com/150/f7d6c8/5c4d46?text=LOGO" alt="Logotipo Raio de Sol" class="circle-logo">
                </div>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="desktop-logo-box">
                <span class="text-logo">Raio de sol</span>
            </div>

            <div class="container">
                <div class="product-grid" id="productGrid">
                    </div>
            </div>

            <footer>
                <p>&copy; 2026 Raio de Sol. Criado com Carinho. 
                    <i class="fa-solid fa-feather admin-trigger" onclick="checkAdminPassword()"></i>
                </p>
                <!-- Fonte fixa para o logo -->
            </footer>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <div class="close-btn" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></div>
            <button class="nav-btn prev-btn" id="prevBtn" onclick="changeImage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <img src="" alt="Produto" class="lightbox-img" id="lightboxImg">
            <div class="lightbox-details">
                <h2 id="lbTitle" style="font-size:1.2rem; margin-bottom:6px;">Nome</h2>
                <div class="lightbox-price"><span class="price-tag" id="lbPrice">0.00 €</span></div>
            </div>
            <button class="nav-btn next-btn" id="nextBtn" onclick="changeImage(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <div class="admin-modal" id="adminModal">
        <div class="admin-box">
            <h2><i class="fa-solid fa-plus"></i> Inserir Artigo</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Nome do Artigo:</label>
                    <input type="text" id="artName" required>
                </div>
                <div class="form-group">
                    <label>Preço (€):</label>
                    <input type="text" id="artPrice" required placeholder="Ex: 19.99">
                </div>
                <div class="form-group">
                    <label>Categoria:</label>
                    <select id="artCategory">
                        <option value="Roupa">Roupa</option>
                        <option value="Acessórios">Acessórios</option>
                        <option value="Bolsas">Bolsas</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Links das Imagens (separadas por vírgula):</label>
                    <textarea id="artUrls" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Gravar Produto</button>
            </form>

            <hr style="margin:18px 0; border:0; border-top:2px solid var(--secondary-color);">

            <h2><i class="fa-solid fa-list-check"></i> Gerir Artigos Existentes</h2>
            <div class="admin-item-list" id="adminItemList">
                </div>

            <hr style="margin:18px 0; border:0; border-top:2px solid var(--secondary-color);">

            <h2><i class="fa-regular fa-image"></i> Alterar Imagem do Logótipo</h2>
            <form id="changeLogoForm">
                <div class="form-group">
                    <label>URL do Novo Logótipo (Círculo):</label>
                    <input type="text" id="logoUrl" required placeholder="Cole o link da imagem">
                </div>
                <button type="submit" class="btn-submit" style="background:var(--text-dark); color:#fff;">Atualizar Imagem</button>
            </form>

            <div class="admin-close" onclick="closeAdmin()" style="margin-top:15px; text-align:center; cursor:pointer; text-decoration:underline; font-size:0.85rem;">Sair do Painel</div>
            <button onclick="clearAllData()" style="width:100%; padding:9px; background:#f2dede; color:#a94442; border:none; border-radius:10px; margin-top:15px; cursor:pointer; font-size:0.8rem; font-weight:600;">Limpar Toda a Loja</button>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('raioDeSolProducts')) || [];
        let savedLogo = localStorage.getItem('raioDeSolLogo');

        if (savedLogo) {
            document.getElementById('siteLogoCircle').src = savedLogo;
        }

        if (products.length === 0) {
            products = [
                {
                    id: 1,
                    name: "Casaco Knit Doce",
                    price: "39.90",
                    category: "Roupa",
                    images: ["https://images.unsplash.com/photo-1515347619362-715d71b26851?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"]
                },
                {
                    id: 2,
                    name: "Mala Vintage Pastel",
                    price: "29.95",
                    category: "Bolsas",
                    images: [
                        "https://images.unsplash.com/photo-1584916201218-f4242ceb4809?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                        "https://images.unsplash.com/photo-1591561954557-26941169b49e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                    ]
                }
            ];
            saveProducts();
        }

        // --- GESTÃO DA SIDEBAR ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (window.innerWidth <= 992) {
                sidebar.classList.toggle('active');
                overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
            }
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 992) {
                document.getElementById('sidebarOverlay').style.display = 'none';
                document.getElementById('sidebar').classList.remove('active');
            }
        });

        // --- RENDERIZADOR PRINCIPAL DE PRODUTOS ---
        const grid = document.getElementById('productGrid');

        function renderProducts(filterCategory = 'Todos') {
            grid.innerHTML = '';
            const filtered = filterCategory === 'Todos' ? products : products.filter(p => p.category === filterCategory);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-msg" style="text-align:center; grid-column:1/-1; padding:40px; color:var(--text-muted);"><i class="fa-solid fa-cloud-sun" style="font-size:2rem;"></i><br><br>Sem artigos nesta categoria.</div>';
                return;
            }

            filtered.forEach(product => {
                const hasMultiple = product.images.length > 1;
                const badgeHtml = hasMultiple ? `<div class="multiple-images-badge"><i class="fa-regular fa-images"></i> +</div>` : '';

                grid.innerHTML += `
                    <div class="product-card" onclick="openLightboxById(${product.id}, 0)">
                        <div class="product-image-container">
                            <img src="${product.images}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400x500?text=Indisponivel'">
                            ${badgeHtml}
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${product.name}</h3>
                            <div class="product-category">${product.category}</div>
                            <div><span class="price-tag">${parseFloat(product.price).toFixed(2)} €</span></div>
                            <button class="details-btn">Ver Artigo</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- GERAR LISTA DE PRODUTOS NO PAINEL ADMIN PARA APAGAR ---
        const adminItemList = document.getElementById('adminItemList');

        function renderAdminItems() {
            adminItemList.innerHTML = '';
            if (products.length === 0) {
                adminItemList.innerHTML = '<div style="text-align:center; padding:15px; font-size:0.85rem; color:var(--text-muted);">Nenhum produto cadastrado.</div>';
                return;
            }

            products.forEach(product => {
                adminItemList.innerHTML += `
                    <div class="admin-item-row">
                        <div class="admin-item-info">
                            <img src="${product.images}" class="admin-item-thumb" onerror="this.src='https://via.placeholder.com/50x50?text=X'">
                            <span class="admin-item-name">${product.name}</span>
                        </div>
                        <button class="btn-delete-item" onclick="deleteProductById(${product.id})">Apagar</button>
                    </div>
                `;
            });
        }

        // --- FUNÇÃO PARA ELIMINAR UM PRODUTO ESPECÍFICO ---
        function deleteProductById(id) {
            const index = products.findIndex(p => p.id === id);
            if (index !== -1) {
                const pName = products[index].name;
                if (confirm(`Queres mesmo apagar o artigo "${pName}"?`)) {
                    products.splice(index, 1);
                    saveProducts();
                    renderProducts();      // Atualiza a loja
                    renderAdminItems();    // Atualiza a lista do painel admin
                }
            }
        }

        function filterProducts(category) {
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            const target = Array.from(document.querySelectorAll('.menu-btn')).find(b => b.getAttribute('onclick').includes(`'${category}'`));
            if(target) target.classList.add('active');
            
            renderProducts(category);
            toggleSidebar();
        }

        // --- LIGHTBOX ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lbTitle = document.getElementById('lbTitle');
        const lbPrice = document.getElementById('lbPrice');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentProduct = null, currentIndex = 0;

        function openLightboxById(id, idx) {
            currentProduct = products.find(p => p.id === id);
            if (!currentProduct) return;
            currentIndex = idx;
            updateLightbox();
            prevBtn.style.display = nextBtn.style.display = currentProduct.images.length > 1 ? 'flex' : 'none';
            lightbox.classList.add('active');
        }
        function closeLightbox() { lightbox.classList.remove('active'); }
        function changeImage(dir) {
            currentIndex += dir;
            if (currentIndex >= currentProduct.images.length) currentIndex = 0;
            else if (currentIndex < 0) currentIndex = currentProduct.images.length - 1;
            updateLightbox();
        }
        function updateLightbox() {
            lightboxImg.src = currentProduct.images[currentIndex];
            lbTitle.innerText = currentProduct.name;
            lbPrice.innerText = `${parseFloat(currentProduct.price).toFixed(2)} €`;
        }

        // --- CONTROLO ADMIN ---
        const adminModal = document.getElementById('adminModal');
        function checkAdminPassword() {
            const pwd = prompt("Código de Administração:");
            if (pwd === 'admin123') {
                renderAdminItems(); // Atualiza a lista sempre que abre o painel
                adminModal.classList.add('active');
            }
            else if (pwd !== null) alert("Incorreto.");
        }
        function closeAdmin() { adminModal.classList.remove('active'); }

        document.getElementById('changeLogoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const url = document.getElementById('logoUrl').value;
            localStorage.setItem('raioDeSolLogo', url);
            document.getElementById('siteLogoCircle').src = url;
            alert("Imagem do logótipo circular atualizada!");
            this.reset();
        });

        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('artName').value;
            const price = document.getElementById('artPrice').value.replace(',', '.');
            const category = document.getElementById('artCategory').value;
            const urls = document.getElementById('artUrls').value.split(',').map(u => u.trim()).filter(u => u !== '');

            if(urls.length === 0 || isNaN(price) || price === '') {
                alert("Dados inválidos."); return;
            }

            products.unshift({ id: Date.now(), name, price, category, images: urls });
            saveProducts();
            this.reset(); 
            renderAdminItems(); // Atualiza a listagem interna do admin
            renderProducts();
            alert("Artigo adicionado!");
        });

        function saveProducts() { localStorage.setItem('raioDeSolProducts', JSON.stringify(products)); }
        
        function clearAllData() {
            if(confirm("Apagar absolutamente toda a loja?")) { 
                products = []; 
                saveProducts(); 
                renderProducts(); 
                renderAdminItems();
                closeAdmin(); 
            }
        }

        // Inicialização primária
        renderProducts();
    </script>
</body>
</html>
